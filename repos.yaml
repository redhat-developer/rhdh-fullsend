# Fleet manifest for RHDH fullsend per-repo installations.
# https://fullsend.sh/docs/guides/getting-started/repo-management
#
# Roll out a new fullsend version (creates PRs, never pushes to default):
#   1. Bump github.fullsend_ref below
#   2. fullsend repos install -f repos.yaml
#   3. Review and merge the scaffold PRs in each target repo
#
# Converge a single repo:
#   fullsend repos install -f repos.yaml redhat-developer/rhdh-agentic
version: 1
defaults:
  inference:
    auth: vertex-wif
  config:
    runtime: claude
    allowed_remote_resources:
      - https://raw.githubusercontent.com/fullsend-ai/fullsend/
      - https://raw.githubusercontent.com/fullsend-ai/agents/
github:
  mint_url: https://mint.fullsend.sh
  fullsend_ref: v0.57.1
  repos:
    - name: redhat-developer/rhdh-agentic
    - name: redhat-developer/rhdh-cli
    - name: redhat-developer/rhdh-plugins
    - name: redhat-developer/rhdh-plugin-export-overlays
    - name: redhat-developer/rhdh-skills
    - name: rhdh-parasol/rhdh
    - name: rhdh-parasol/rhdh-agentic
    - name: rhdh-parasol/rhdh-operator
    - name: rhdh-parasol/rhdh-plugins
    - name: rhdh-parasol/rhdh-plugin-export-overlays
      # Adopted from the repo's hand-written .fullsend/config.yaml (ADR-0122).
      config:
        agents:
          - name: code
            source: rhdh/harness/code.yaml
          - name: fix
            source: rhdh/harness/fix.yaml
          - name: review
            source: rhdh/harness/review.yaml
            subagents:
              default: inherit
          - name: e2e-triage
            source: rhdh/harness/e2e-triage.yaml
          - name: ci-diagnose
            source: rhdh/harness/ci-diagnose.yaml
        roles: [triage, coder, review, fix, retro, prioritize]
        tracker:
          github:
            allowed_targets:
              repos:
                - rhdh-parasol/rhdh-plugin-export-overlays
                - fullsend-ai/fullsend
        models:
          aliases:
            opus: claude-opus-5-5
            sonnet: claude-sonnet-5-5
            haiku: claude-haiku-5-5
